name: Tests

on:
  pull_request:
  push:
    branches:
      - main
    tags-ignore:
      - "**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Check frontend
        working-directory: frontend
        run: npm run check

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify generated files and modules are current
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum frontend/package-lock.json frontend/dist

      - name: Build packages
        run: go build ./...

      - name: Build CLI
        run: go build -ldflags "-s -w -X main.version=dev" -o gol ./frontend

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: Test
        run: go test -race -v ./... -count=1 -coverprofile=coverage.out
