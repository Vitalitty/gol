services:
  gol:
    image: ghcr.io/vitalitty/gol:latest
    container_name: gol
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${GOL_PORT:-3003}:3003"
    volumes:
      - "${GOL_LOG_DIR:-./logs}:/logs:ro"
      # Enable SSH log targets by mounting keys read-only.
      # - "${GOL_SSH_DIR:-~/.ssh}:/home/gol/.ssh:ro"
      # Enable Docker log targets by mounting the Docker socket.
      # - "/var/run/docker.sock:/var/run/docker.sock"
    # Docker socket access usually requires root or a matching docker group.
    # user: root
